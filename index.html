<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VELORA | Currency Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fon effektlari -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="container">

        <!-- HEADER -->
        <header class="header">

            <div class="logo-box">
                <div class="logo">V</div>

                <div>
                    <h1>VELORA</h1>
                    <p>CURRENCY CONVERTER</p>
                </div>
            </div>

            <div class="live-status">
                <span></span>
                LIVE
            </div>

        </header>


        <!-- HERO -->
        <section class="hero">

            <p class="mini-title">
                VALYUTA KONVERTERI
            </p>

            <h2>
                Valyutani
                <span>oson hisoblang.</span>
            </h2>

            <p class="hero-text">
                Kerakli valyutani tanlang, summani kiriting
                va natijani bir zumda hisoblang.
            </p>

        </section>


        <!-- CONVERTER -->
        <section class="converter">

            <!-- AMOUNT -->
            <div class="input-group">

                <label>SUMMA</label>

                <input
                    type="number"
                    id="amount"
                    value="100"
                    min="0"
                    placeholder="Summani kiriting"
                >

            </div>


            <!-- CURRENCIES -->
            <div class="currency-area">

                <div class="currency-box">

                    <label>DAN</label>

                    <select id="fromCurrency">

                        <option value="USD">
                            🇺🇸 USD — Dollar
                        </option>

                        <option value="UZS">
                            🇺🇿 UZS — So'm
                        </option>

                        <option value="EUR">
                            🇪🇺 EUR — Yevro
                        </option>

                        <option value="GBP">
                            🇬🇧 GBP — Funt
                        </option>

                        <option value="RUB">
                            🇷🇺 RUB — Rubl
                        </option>

                        <option value="JPY">
                            🇯🇵 JPY — Iyen
                        </option>

                    </select>

                </div>


                <!-- SWAP -->
                <button
                    class="swap-button"
                    id="swapButton"
                    title="Almashtirish"
                >
                    ⇄
                </button>


                <div class="currency-box">

                    <label>GA</label>

                    <select id="toCurrency">

                        <option value="UZS">
                            🇺🇿 UZS — So'm
                        </option>

                        <option value="USD">
                            🇺🇸 USD — Dollar
                        </option>

                        <option value="EUR">
                            🇪🇺 EUR — Yevro
                        </option>

                        <option value="GBP">
                            🇬🇧 GBP — Funt
                        </option>

                        <option value="RUB">
                            🇷🇺 RUB — Rubl
                        </option>

                        <option value="JPY">
                            🇯🇵 JPY — Iyen
                        </option>

                    </select>

                </div>

            </div>


            <!-- BUTTON -->
            <button
                class="convert-button"
                id="convertButton"
            >
                HISOBLASH
                <span>→</span>
            </button>


            <!-- RESULT -->
            <div class="result-box">

                <div>

                    <p>NATIJA</p>

                    <h3 id="result">
                        0 UZS
                    </h3>

                </div>

                <div class="result-symbol">
                    $
                </div>

            </div>


            <!-- RATE -->
            <div
                class="rate"
                id="rate"
            >
                Kurs: —
            </div>

        </section>


        <!-- QUICK AMOUNTS -->
        <section class="quick">

            <p>TEZKOR SUMMALAR</p>

            <div class="quick-buttons">

                <button data-value="10">
                    $10
                </button>

                <button data-value="50">
                    $50
                </button>

                <button data-value="100">
                    $100
                </button>

                <button data-value="500">
                    $500
                </button>

                <button data-value="1000">
                    $1,000
                </button>

            </div>

        </section>


        <!-- FOOTER -->
        <footer>

            <span>VELORA</span>
            Currency Converter © 2026

        </footer>

    </div>


    <!-- TOAST -->
    <div
        class="toast"
        id="toast"
    >
        Hisoblandi ✓
    </div>


    <script src="script.js"></script>

</body>
</html>
